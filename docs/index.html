<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nhan dien ban tay - Web (MediaPipe WASM)</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 16px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
    max-width: 640px;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }
  video {
    display: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hud {
    margin-top: 14px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.95rem;
  }
  .hud .item {
    background: #1c1c1c;
    border: 1px solid #2c2c2c;
    border-radius: 8px;
    padding: 8px 14px;
    min-width: 140px;
    text-align: center;
  }
  .hud .label {
    color: #888;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .hud .value {
    font-weight: 600;
    margin-top: 2px;
  }
  button {
    margin-top: 16px;
    background: #2d6cdf;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    background: #444;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    color: #999;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <h1>Nhan dien ban tay + tu giac 2 tay (chay hoan toan trong trinh duyet)</h1>
  <p class="sub">
    Port lai tu ban Python (main_webcam.py) sang JavaScript + MediaPipe Tasks
    Vision (WASM) - khong can server, khong gui webcam len bat ky dau, chay
    truc tiep tren may ban.
  </p>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="startBtn">Bat dau webcam</button>
  <div id="status"></div>

  <div class="hud">
    <div class="item">
      <div class="label">Tay trai</div>
      <div class="value" id="leftGesture">-</div>
    </div>
    <div class="item">
      <div class="label">Tay phai</div>
      <div class="value" id="rightGesture">-</div>
    </div>
    <div class="item">
      <div class="label">Hieu ung tu giac</div>
      <div class="value" id="effectName">-</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
